<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massachusetts Wetlands Map</title>
  <meta name="description" content="Interactive map of National Wetlands Inventory wetlands in Massachusetts, loaded live from an OGC API - Features service.">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --accent: #1565c0;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    #map { position: absolute; inset: 0; }
    /* Gray basemap only; the wetland polygons (overlay pane) keep their colors. */
    .leaflet-tile-pane { filter: grayscale(1) brightness(1.08) contrast(0.85); }
    .panel {
      position: absolute; z-index: 1000; top: 12px; left: 56px;
      width: 320px; max-width: calc(100% - 72px);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      padding: 14px 16px; font-size: 14px; line-height: 1.4;
    }
    .panel h1 { font-size: 17px; margin: 0 0 2px; }
    .panel .sub { color: var(--muted); margin: 0 0 10px; font-size: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    select {
      width: 100%; padding: 6px 8px; font: inherit; font-size: 14px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);
    }
    #status { margin: 10px 0; min-height: 20px; color: var(--muted); }
    #status.error { color: var(--error); }
    #status.loading::before {
      content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px;
      border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%;
      animation: spin .8s linear infinite; vertical-align: -1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
    .legend { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
    .legend li { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); }
    .links { margin-top: 10px; font-size: 13px; border-top: 1px solid var(--border); padding-top: 8px; }
    .links a { color: var(--accent); margin-right: 12px; }
    .popup dt { font-weight: 600; font-size: 12px; color: var(--muted); }
    .popup dd { margin: 0 0 6px; }
    @media (max-width: 600px) {
      .panel { left: 12px; right: 12px; width: auto; max-width: none; top: auto; bottom: 44px; padding: 10px 12px; }
      .panel .sub { display: none; }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Map of Massachusetts wetlands"></div>

  <div class="panel">
    <h1>Massachusetts Wetlands</h1>
    <p class="sub">National Wetlands Inventory polygons, loaded live from an
      OGC API - Features service as you pan and zoom.</p>

    <label for="type">Wetland type</label>
    <select id="type">
      <option value="">All types</option>
    </select>

    <div id="status" aria-live="polite"></div>

    <details open id="legend-box">
      <summary>Legend</summary>
      <ul class="legend" id="legend"></ul>
    </details>

    <div class="links">
      <a id="api-link" target="_blank" rel="noopener">API</a>
      <a href="https://github.com/liammartin3/ma-wetlands-api" target="_blank" rel="noopener">Code</a>
      <a href="/">Portfolio</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    // The only place the API address lives; change it here if the domain changes.
    const API = "https://54-211-175-202.sslip.io";
    const ITEMS = API + "/collections/wetlands/items";
    const LIMIT = 500;     // the server's max_items
    const MIN_ZOOM = 12;   // below this a view holds thousands of wetlands

    const TYPES = {
      "Freshwater Forested/Shrub Wetland": "#2e7d32",
      "Freshwater Emergent Wetland":       "#9ccc65",
      "Freshwater Pond":                   "#4fc3f7",
      "Lake":                              "#1565c0",
      "Riverine":                          "#00838f",
      "Estuarine and Marine Wetland":      "#4db6ac",
      "Estuarine and Marine Deepwater":    "#004d40",
      "Other":                             "#8d6e63",
    };

    document.getElementById("api-link").href = API + "/";
    // On phones, start with the legend collapsed so the map stays visible.
    if (window.matchMedia("(max-width: 600px)").matches) {
      document.getElementById("legend-box").open = false;
    }

    const typeSelect = document.getElementById("type");
    const legend = document.getElementById("legend");
    for (const [name, color] of Object.entries(TYPES)) {
      typeSelect.add(new Option(name, name));
      const li = document.createElement("li");
      li.innerHTML = '<span class="swatch"></span>';
      li.firstChild.style.background = color;
      li.append(name);
      legend.append(li);
    }

    // Start near Concord, MA: lots of wetlands, and few enough in view to show them all.
    const map = L.map("map").setView([42.455, -71.36], 14);
    // OpenStreetMap tiles (no API key), shown in gray via CSS so wetland colors stand out.
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' +
                   ' | Wetlands: <a href="https://www.fws.gov/program/national-wetlands-inventory">USFWS NWI</a>',
    }).addTo(map);

    const layer = L.geoJSON(null, {
      style: f => ({
        color: TYPES[f.properties.WETLAND_TYPE] || "#666",
        weight: 1,
        fillOpacity: 0.65,
      }),
      onEachFeature: (f, lyr) => lyr.bindPopup(() => popupHtml(f)),
    }).addTo(map);

    const statusEl = document.getElementById("status");
    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    function popupHtml(f) {
      const p = f.properties;
      const url = ITEMS + "/" + encodeURIComponent(f.id) + "?f=json";
      return '<dl class="popup">' +
        "<dt>Type</dt><dd>" + esc(p.WETLAND_TYPE) + "</dd>" +
        "<dt>Cowardin code</dt><dd>" + esc(p.ATTRIBUTE) + "</dd>" +
        "<dt>Area</dt><dd>" + Number(p.ACRES_GEOM).toLocaleString(undefined, {maximumFractionDigits: 2}) + " acres</dd>" +
        '</dl><a href="' + esc(url) + '" target="_blank" rel="noopener">View as GeoJSON</a>';
    }

    let controller = null;
    let timer = null;

    async function load() {
      if (controller) controller.abort();   // drop the request for the previous view
      if (map.getZoom() < MIN_ZOOM) {
        layer.clearLayers();
        setStatus("Zoom in to load wetlands.");
        return;
      }
      controller = new AbortController();
      const b = map.getBounds();
      const params = new URLSearchParams({
        f: "json",
        limit: LIMIT,
        bbox: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(n => n.toFixed(5)).join(","),
      });
      if (typeSelect.value) params.set("WETLAND_TYPE", typeSelect.value);

      setStatus("Loading wetlands…", "loading");
      try {
        const res = await fetch(ITEMS + "?" + params, {signal: controller.signal});
        if (!res.ok) throw new Error("HTTP " + res.status);
        const fc = await res.json();
        layer.clearLayers();
        layer.addData(fc);
        const shown = fc.features.length;
        const total = fc.numberMatched ?? shown;
        if (total === 0) {
          setStatus("No wetlands of this type in view.");
        } else if (shown < total) {
          setStatus(`Showing ${shown.toLocaleString()} of ${total.toLocaleString()} wetlands in view. Zoom in to see all.`);
        } else {
          setStatus(`${total.toLocaleString()} wetland${total === 1 ? "" : "s"} in view.`);
        }
      } catch (err) {
        if (err.name === "AbortError") return;
        setStatus("Couldn't load wetlands (" + err.message + "). Try again in a moment.", "error");
      }
    }

    function scheduleLoad() {
      clearTimeout(timer);
      timer = setTimeout(load, 350);   // wait for panning to settle
    }

    map.on("moveend", scheduleLoad);
    typeSelect.addEventListener("change", load);
    load();
  </script>
</body>
</html>
